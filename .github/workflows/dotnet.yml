name: .NET checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run rating regression tests
        run: dotnet test tests/PokemonWebAPI.Tests/PokemonWebAPI.Tests.csproj --configuration Release
